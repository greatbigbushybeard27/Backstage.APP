<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101113"><title>Backstage | Event Operations</title>
<style>
:root{--ink:#101113;--panel:#fff;--bg:#f2f3f5;--line:#d7dbe0;--muted:#68707a;--amber:#f2a900;--charcoal:#242629;--blue:#dfe9f5;--blue-line:#456b98;--green:#dff1e9;--green-line:#218163;--orange:#fff0d8;--orange-line:#c47b0a;--purple:#eee7f8;--purple-line:#8060a5}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#17191c;background:var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer;border-radius:3px;border:1px solid #c8cdd3;background:#fff;color:#202328;padding:9px 12px;font-weight:650}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--amber);outline-offset:2px}.app-header{height:58px;position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:13px;padding:0 18px;background:var(--ink);color:#fff;border-bottom:2px solid var(--amber)}.menu-btn{background:transparent;color:#fff;border-color:#45484d;padding:6px 10px;font-size:20px}.brand{display:flex;align-items:center;gap:10px}.brand-mark{width:32px;height:32px;display:grid;place-items:center;border:1px solid var(--amber);color:var(--amber);font-size:23px;font-weight:850}.brand-name{font-size:15px;letter-spacing:.13em;font-weight:850}.brand-sub{font-size:9px;letter-spacing:.13em;color:#c1c5ca;margin-top:2px}.header-right{margin-left:auto;font-size:11px;color:#c6c9cd;letter-spacing:.04em}.layout{min-height:calc(100vh - 58px)}.sidebar{position:fixed;z-index:15;left:0;top:58px;bottom:0;width:230px;padding:12px 10px;background:#17191c;border-right:1px solid #303338;display:flex;flex-direction:column;gap:3px;overflow-y:auto}.nav-label{font-size:10px;letter-spacing:.14em;color:#858c95;padding:14px 10px 6px;font-weight:800}.nav-btn{width:100%;display:flex;align-items:center;gap:11px;text-align:left;color:#d9dce0;background:transparent;border-color:transparent;padding:10px 11px;font-size:13px}.nav-btn .ico{width:18px;text-align:center;color:var(--amber);font-size:15px}.nav-btn.active{background:#2a2c30;border-color:#3b3f44;border-left:3px solid var(--amber);padding-left:9px;color:#fff}.sidebar-foot{margin-top:auto;padding:14px 10px 5px;color:#7f8790;font-size:10px;line-height:1.6}.main{margin-left:230px;padding:18px 20px 34px;max-width:1800px}.page-heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 15px}.page-heading h1{font-size:22px;letter-spacing:-.035em;margin:0;font-weight:780}.page-heading p{margin:4px 0 0;font-size:12px;color:var(--muted)}.calendar{background:#fff;border:1px solid var(--line)}.cal-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}.month-controls{display:flex;align-items:center;gap:6px}.month-label{min-width:155px;text-align:center;font-size:15px;font-weight:800}.primary{background:var(--ink);color:#fff;border-color:var(--ink)}.filterbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:10px 14px;background:#f8f9fa;border-bottom:1px solid var(--line)}.filter.active{background:var(--ink);color:#fff;border-color:var(--ink)}.legend{margin-left:auto;display:flex;align-items:center;gap:11px;flex-wrap:wrap;color:#5d646d;font-size:11px}.legend span{display:flex;align-items:center;gap:5px}.dot{width:9px;height:9px;display:inline-block}.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.weekday{background:#f1f3f5;padding:9px 8px;border-bottom:1px solid var(--line);border-right:1px solid #e0e3e7;font-size:10px;font-weight:800;letter-spacing:.08em;color:#646b74}.weekday:nth-child(7){border-right:0}.day{min-width:0;min-height:126px;padding:6px;border-right:1px solid #e0e3e7;border-bottom:1px solid #e0e3e7;background:#fff}.day:nth-child(7n){border-right:0}.day.other{background:#f8f9fa}.day.today{box-shadow:inset 0 0 0 2px var(--amber)}.day-num{font-size:12px;font-weight:800;color:#363c43;margin:0 0 6px}.other .day-num{color:#9aa0a7}.events{display:grid;gap:3px}.event{display:block;width:100%;min-width:0;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:0;border-left:3px solid;padding:5px 5px;border-radius:2px;font-size:10px;line-height:1.2;font-weight:750}.event.jobs{background:var(--blue);border-left-color:var(--blue-line);color:#263b56}.event.portaloo{background:var(--green);border-left-color:var(--green-line);color:#145b48}.event.hirevan{background:var(--orange);border-left-color:var(--orange-line);color:#754500}.event.marquee{background:var(--purple);border-left-color:var(--purple-line);color:#553a7a}.event.done{opacity:.55;text-decoration:line-through}.more{font-size:10px;color:#68707a;padding:2px}.cal-foot{display:flex;justify-content:space-between;gap:10px;padding:10px 14px;background:#fafbfc;color:#68707a;font-size:11px}.empty{padding:30px 20px;text-align:center;color:var(--muted);border:1px dashed #cbd0d6;background:#fff}.simple-panel{background:#fff;border:1px solid var(--line);padding:18px}.simple-panel h2{font-size:16px;margin:0 0 8px}.simple-panel p{font-size:13px;color:var(--muted);line-height:1.5}.overlay{position:fixed;inset:0;z-index:50;background:#1118;display:none;align-items:center;justify-content:center;padding:16px}.overlay.open{display:flex}.dialog{width:min(460px,100%);background:#fff;border:1px solid var(--line);box-shadow:0 16px 48px #0003;padding:18px}.dialog-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.dialog h2{margin:0;font-size:18px}.field{display:grid;gap:5px;margin-bottom:12px}.field label{font-size:12px;font-weight:750}.field input,.field select{width:100%;padding:10px;border:1px solid #c8cdd3;border-radius:3px;background:#fff}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.mobile-backdrop{display:none}
@media(max-width:800px){.main{margin-left:0;padding:12px 8px 24px}.sidebar{transform:translateX(-105%);transition:transform .18s ease;width:260px;box-shadow:8px 0 24px #0002}.sidebar.open{transform:translateX(0)}.mobile-backdrop.open{display:block;position:fixed;inset:58px 0 0;z-index:14;background:#0006}.header-right{display:none}.cal-top{align-items:flex-start;flex-direction:column;padding:12px}.month-controls{width:100%;justify-content:space-between}.filterbar{padding:8px}.legend{margin-left:0;width:100%}.day{min-height:88px;padding:4px}.weekday{padding:7px 2px;font-size:9px}.event{font-size:9px;padding:4px 3px}.day-num{font-size:11px}.cal-foot{font-size:10px}.brand-name{font-size:14px}.month-label{min-width:130px}}
@media(max-width:420px){.filter{padding:7px 8px;font-size:12px}.day{min-height:76px}.event{font-size:8px}.legend{gap:7px;font-size:10px}.cal-foot{flex-direction:column}}
</style></head><body>
<header class="app-header"><button class="menu-btn" id="menuToggle" aria-label="Toggle navigation">☰</button><div class="brand"><div class="brand-mark">B</div><div><div class="brand-name">BACKSTAGE</div><div class="brand-sub">EVENT OPERATIONS</div></div></div><div class="header-right">LOCAL WORKSPACE · DESIGN PREVIEW</div></header>
<div class="mobile-backdrop" id="backdrop"></div>
<aside class="sidebar" id="sidebar"><div class="nav-label">WORKSPACE</div><button class="nav-btn active" data-page="calendar"><span class="ico">▦</span>Calendar</button><button class="nav-btn" data-page="jobs"><span class="ico">▣</span>Jobs</button><button class="nav-btn" data-page="portaloo"><span class="ico">▤</span>Portaloo Jobs</button><button class="nav-btn" data-page="hirevan"><span class="ico">▰</span>Hire Van Jobs</button><button class="nav-btn" data-page="marquee"><span class="ico">⌂</span>Marquee Jobs</button><div class="nav-label">RESOURCES</div><button class="nav-btn" data-page="equipment"><span class="ico">▦</span>Equipment</button><button class="nav-btn" data-page="crew"><span class="ico">♙</span>Crew & Documents</button><button class="nav-btn" data-page="settings"><span class="ico">⚙</span>Settings</button><div class="sidebar-foot">BACKSTAGE<br>Event production management<br>Local design build</div></aside>
<main class="main" id="main"></main>
<div class="overlay" id="eventOverlay" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><form class="dialog" id="eventForm"><div class="dialog-head"><h2 id="dialogTitle">Add calendar job</h2><button type="button" id="closeDialog" aria-label="Close dialog">✕</button></div><div class="field"><label for="jobName">Job name</label><input id="jobName" required maxlength="100" placeholder="e.g. Summer Festival" /></div><div class="field"><label for="jobType">Job type</label><select id="jobType"><option value="jobs">Job</option><option value="portaloo">Portaloo Job</option><option value="hirevan">Hire Van Job</option><option value="marquee">Marquee Job</option></select></div><div class="field"><label for="jobStart">Start date</label><input id="jobStart" type="date" required /></div><div class="field"><label for="jobEnd">End date (optional)</label><input id="jobEnd" type="date" /></div><div class="dialog-actions"><button type="button" id="cancelDialog">Cancel</button><button class="primary" type="submit">Save job</button></div></form></div>
<script>
(()=>{'use strict';
const STORAGE_KEY='backstage_clean_calendar_v2';
const typeNames={jobs:'Job',portaloo:'Portaloo Job',hirevan:'Hire Van Job',marquee:'Marquee Job'};
let jobs=[];let month=new Date(new Date().getFullYear(),new Date().getMonth(),1);let filter='all';let page='calendar';let selectedDate='';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const key=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
function load(){try{const x=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');jobs=Array.isArray(x)?x:[]}catch(e){jobs=[]}}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(jobs))}catch(e){alert('Could not save in this browser. Check available storage.')}}
function visible(j){return filter==='all'||filter===j.type||filter==='jobs'&&j.type==='jobs'}
function jobsOn(day){return jobs.filter(j=>visible(j)&&j.start<=day&&day<=(j.end||j.start)).sort((a,b)=>a.type.localeCompare(b.type)||a.name.localeCompare(b.name))}
function renderCalendar(){const y=month.getFullYear(),m=month.getMonth(),first=new Date(y,m,1),offset=first.getDay(),days=new Date(y,m+1,0).getDate(),count=Math.ceil((offset+days)/7)*7,today=key(new Date());let cells=['SUN','MON','TUE','WED','THU','FRI','SAT'].map(d=>`<div class="weekday">${d}</div>`).join('');let total=0;
for(let i=0;i<count;i++){const date=new Date(y,m,1-offset+i),day=key(date),list=jobsOn(day),classes=(date.getMonth()!==m?' other':'')+(day===today?' today':'');total+=list.length;const blocks=list.slice(0,4).map(j=>`<button class="event ${esc(j.type)} ${j.done?'done':''}" data-job="${esc(j.id)}" title="${esc(j.name)} · ${esc(typeNames[j.type])}">${esc(j.name)}</button>`).join('');const more=list.length>4?`<div class="more">+${list.length-4} more</div>`:'';cells+=`<div class="day${classes}" data-date="${day}"><div class="day-num">${date.getDate()}</div><div class="events">${blocks}${more}</div></div>`}
const filters=[['all','All Jobs'],['jobs','Jobs'],['portaloo','Portaloo Jobs'],['hirevan','Hire Van Jobs']];
$('main').innerHTML=`<div class="page-heading"><div><h1>Calendar</h1><p>All your event operations, at a glance.</p></div><button class="primary" id="addJob">＋ Add job</button></div><section class="calendar"><div class="cal-top"><div><strong>Schedule</strong><div style="font-size:11px;color:#68707a;margin-top:3px">Select a date to add a job</div></div><div class="month-controls"><button id="prevMonth" aria-label="Previous month">‹</button><div class="month-label">${month.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</div><button id="nextMonth" aria-label="Next month">›</button><button id="todayBtn">Today</button></div></div><div class="filterbar">${filters.map(([v,label])=>`<button class="filter ${filter===v?'active':''}" data-filter="${v}">${label}</button>`).join('')}<div class="legend"><span><i class="dot" style="background:#456b98"></i>Jobs</span><span><i class="dot" style="background:#218163"></i>Portaloo</span><span><i class="dot" style="background:#c47b0a"></i>Hire vans</span><span><i class="dot" style="background:#8060a5"></i>Marquees</span></div></div><div class="grid">${cells}</div><div class="cal-foot"><span>${total} scheduled entries in this view</span><span>Tap a day to add a job · Tap a coloured block to edit</span></div></section>`;
$('prevMonth').onclick=()=>{month=new Date(y,m-1,1);renderCalendar()};$('nextMonth').onclick=()=>{month=new Date(y,m+1,1);renderCalendar()};$('todayBtn').onclick=()=>{month=new Date(new Date().getFullYear(),new Date().getMonth(),1);renderCalendar()};$('addJob').onclick=()=>openDialog(key(new Date()));document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;renderCalendar()});document.querySelectorAll('.day').forEach(d=>d.onclick=e=>{if(e.target.closest('[data-job]'))return;openDialog(d.dataset.date)});document.querySelectorAll('[data-job]').forEach(b=>b.onclick=e=>{e.stopPropagation();editJob(b.dataset.job)});
}
function renderList(type){const list=jobs.filter(j=>type==='all'||j.type===type).sort((a,b)=>a.start.localeCompare(b.start));$('main').innerHTML=`<div class="page-heading"><div><h1>${type==='all'?'Jobs':type==='equipment'?'Equipment':type==='crew'?'Crew & Documents':type==='settings'?'Settings':typeNames[type]||'Jobs'}</h1><p>${type==='equipment'||type==='crew'||type==='settings'?'This section will be developed in the next build.':'Jobs saved in this browser.'}</p></div>${['jobs','portaloo','hirevan','marquee'].includes(type)?'<button class="primary" id="addJob">＋ Add job</button>':''}</div>${['equipment','crew','settings'].includes(type)?`<section class="simple-panel"><h2>${type==='equipment'?'Equipment management':type==='crew'?'Crew and documents':'Local workspace settings'}</h2><p>${type==='settings'?'This build stores demo jobs only in this browser. It does not connect to Supabase or any remote database.': 'This is a clean interface foundation. This section has intentionally not imported the old application code yet.'}</p></section>`:list.length?`<section class="simple-panel"><div style="display:grid;gap:0">${list.map(j=>`<div style="display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #e2e5e8"><span class="dot" style="width:4px;height:32px;background:${j.type==='jobs'?'#456b98':j.type==='portaloo'?'#218163':j.type==='hirevan'?'#c47b0a':'#8060a5'}"></span><div style="flex:1;min-width:0"><strong>${esc(j.name)}</strong><div style="font-size:11px;color:#68707a;margin-top:3px">${esc(typeNames[j.type])} · ${esc(j.start)}${j.end&&j.end!==j.start?' to '+esc(j.end):''}</div></div><button data-edit="${esc(j.id)}">Edit</button><button data-delete="${esc(j.id)}">Delete</button></div>`).join('')}</div></section>`:`<div class="empty">No jobs here yet. Add a job to see it on the calendar.</div>`}`;
const add=$('addJob');if(add)add.onclick=()=>openDialog(key(new Date()));document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editJob(b.dataset.edit));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm('Delete this calendar entry?')){jobs=jobs.filter(j=>j.id!==b.dataset.delete);save();render()}})}
function render(){document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.page===page));if(page==='calendar')renderCalendar();else if(page==='jobs')renderList('all');else renderList(page)}
function openDialog(date,job=null){selectedDate=date;$('eventForm').dataset.edit=job?job.id:'';$('dialogTitle').textContent=job?'Edit calendar job':'Add calendar job';$('jobName').value=job?.name||'';$('jobType').value=job?.type||(['jobs','portaloo','hirevan','marquee'].includes(page)?page:'jobs');$('jobStart').value=job?.start||date;$('jobEnd').value=job?.end||'';$('eventOverlay').classList.add('open');setTimeout(()=>$('jobName').focus(),20)}
function closeDialog(){$('eventOverlay').classList.remove('open')}
function editJob(id){const job=jobs.find(j=>j.id===id);if(job)openDialog(job.start,job)}
$('eventForm').onsubmit=e=>{e.preventDefault();const name=$('jobName').value.trim(),type=$('jobType').value,start=$('jobStart').value,end=$('jobEnd').value;if(!name||!start){return}if(end&&end<start){alert('End date must be on or after the start date.');return}const edit=$('eventForm').dataset.edit;let job=edit?jobs.find(j=>j.id===edit):null;if(!job){job={id:crypto.randomUUID?crypto.randomUUID():String(Date.now())};jobs.push(job)}Object.assign(job,{name,type,start,end,updatedAt:new Date().toISOString()});save();closeDialog();page='calendar';render()};$('closeDialog').onclick=closeDialog;$('cancelDialog').onclick=closeDialog;$('eventOverlay').onclick=e=>{if(e.target===$('eventOverlay'))closeDialog()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDialog()});
function toggleMenu(){const open=!$('sidebar').classList.contains('open');$('sidebar').classList.toggle('open',open);$('backdrop').classList.toggle('open',open)}$('menuToggle').onclick=toggleMenu;$('backdrop').onclick=toggleMenu;document.querySelectorAll('.nav-btn').forEach(b=>b.onclick=()=>{page=b.dataset.page;render();$('sidebar').classList.remove('open');$('backdrop').classList.remove('open')});
load();render();
})();
</script></body></html>
